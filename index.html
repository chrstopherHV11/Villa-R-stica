<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Villa Rústica</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f8f1e4;--ink:#3b2d20;--soft:#7f705a;--pink:#6b7b3a;--pink2:#ebe0c8;--lilac:#e2e6c9;--line:#ddd0b2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 8% 0,#e9e0c5 0,transparent 38%),radial-gradient(circle at 100% 18%,#e3e8c8 0,transparent 34%),var(--bg);background-color:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:17px;line-height:1.3}
h1,h2,b,.btn,.big,output{font-family:'Fredoka','DM Sans',system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 140px}
h1{font-size:42px;margin:6px 0 0;font-weight:600;line-height:1;color:var(--pink)}
.tag{color:var(--soft);margin:6px 0 4px}
h2{font-size:21px;margin:26px 0 10px;font-weight:600}
h2 i{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--pink);color:#fff;font-style:normal;font-size:15px;margin-right:8px}
main{counter-reset:n}h2.n{counter-increment:n}h2 i::before{content:counter(n)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:3px solid transparent;background:#fff;border-radius:24px;padding:8px 8px 12px;text-align:center;box-shadow:0 6px 18px rgba(107,123,58,.16);cursor:pointer;font:inherit;color:inherit}
.card.on{border-color:var(--pink);background:#fbf7ee;transform:rotate(-1.5deg)}
.im{background:var(--pink2);border-radius:18px;padding:3px}
.im svg,.ic svg{display:block;width:100%;height:auto}
.card b{display:block;font-size:20px;margin-top:6px;font-weight:600}
.card span{color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:flex;align-items:center;gap:8px;border:2.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 16px 5px 5px;font:inherit;color:inherit;cursor:pointer;text-align:left}
.chip.on{border-color:var(--pink);background:#fbf7ee}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;padding:6px;flex:none}
.chip small{display:block;color:var(--soft);font-size:13px}
.qty{display:flex;align-items:center;gap:14px}
.qty button{width:54px;height:54px;border-radius:50%;border:0;background:var(--pink2);color:var(--pink);font-size:32px;font-family:'Fredoka',sans-serif;cursor:pointer;padding:0}
.qty output{font-size:38px;min-width:46px;text-align:center}
.soft{color:var(--soft)}
input{width:100%;font:inherit;font-size:18px;padding:12px 16px;border:2.5px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);margin-top:14px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(248,241,228,.94);backdrop-filter:blur(8px);border-top:2px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.tot small{display:block;color:var(--soft);font-size:13px}.tot b{font-size:30px;color:var(--pink)}
.btn{font-weight:600;font-size:18px;background:var(--pink);color:#fff;border:0;border-radius:999px;padding:14px 22px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.alt{background:var(--lilac);color:var(--ink)}
.btn.sm{padding:8px 14px;font-size:15px}
.btn:active{transform:scale(.96)}
.fav{display:flex;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:8px;margin-bottom:10px;box-shadow:0 4px 14px rgba(107,123,58,.14)}
.fav .im{width:76px;flex:none}
.fav .tx{flex:1;font-size:14px;color:var(--soft)}.fav .tx b{font-size:17px;color:var(--ink)}
.x{border:0;background:none;font-size:20px;color:var(--soft);cursor:pointer;padding:8px}
.msg{text-align:center;min-height:24px;margin-top:8px;color:#55702a;font-weight:700}
#ov{display:none;position:fixed;inset:0;background:rgba(59,45,32,.5);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px));z-index:10}
.wrap{max-width:480px;margin:0 auto}
.panel{background:#fff;border-radius:28px;padding:18px}
.panel h2{margin:0 0 12px;text-align:center;color:var(--pink)}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.th{width:92px;text-align:center;font-size:13px;line-height:1.2}
.th .im{padding:6px;margin-bottom:4px}
.big{font-size:46px;color:var(--pink);text-align:center;line-height:1;margin-top:14px;font-weight:600}
.cap{text-align:center;color:var(--soft);font-size:13px}
.tk{margin-top:14px;font-size:14px;color:var(--soft);border-top:2px dashed var(--line);padding-top:10px}
.tk hr{border:0;border-top:2px dashed var(--line);margin:8px 0}
.ln{display:flex;justify-content:space-between;gap:8px}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.home{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:24px;max-width:560px;margin:0 auto;min-height:90vh;padding:24px 20px 36px}
.lw{flex:1;display:grid;place-items:center;width:100%}
.logo{width:min(82vw,400px);height:auto;display:block}
.hb{width:100%;display:flex;flex-direction:column;gap:12px}
.btn.lg{font-size:22px;padding:18px 22px}
.back{border:0;background:none;color:var(--pink);font:inherit;font-weight:700;cursor:pointer;padding:6px 0;margin-bottom:4px}
.fh{margin-top:8px}
</style>
</head>

var s={cafe:'latte',milk:'desl',tops:[],qty:1,temp:'hot'},FAV=[],DEF=null,AC;
try{FAV=JSON.parse(localStorage.getItem('cafe-favoritos'))||[];DEF=JSON.parse(localStorage.getItem('cafe-predeterminado'))}catch(e){}
function nm(id){return id==='espresso'||id==='americano'}
function ht(id){return id==='latte'||id==='americano'}
function tp(o){return ht(o.cafe)?(o.temp||'hot'):''}
function unit(o){var u=by(CAF,o.cafe).p+by(MIL,o.milk).p;o.tops.forEach(function(t){u+=by(TOP,t).p});return u}
function key(o){return o.cafe+'|'+o.milk+'|'+o.tops.slice().sort().join(',')+'|'+o.qty+'|'+tp(o)}
function desc(o){var a=[];if(tp(o))a.push(tp(o)==='cold'?'Frío':'Caliente');if(o.milk!=='none')a.push(by(MIL,o.milk).l);o.tops.forEach(function(t){a.push(by(TOP,t).n)});return a.join(' · ')||'Sin extras'}
function chip(at,on,svg,bg,lb,p){return '<button class="chip'+(on?' on':'')+'" '+at+'><span class="ic" style="background:'+bg+'">'+svg+'</span><span>'+lb+'<small>'+(p?'+'+NF(p):'sin costo')+'</small></span></button>'}
function render(){
 var h='';CAF.forEach(function(c){h+='<button class="card'+(s.cafe===c.id?' on':'')+'" data-c="'+c.id+'"><div class="im">'+cup(c.id)+'</div><b>'+c.n+'</b><span>desde '+NF(c.p)+'</span></button>'});$('cafes').innerHTML=h;
 h='';MIL.forEach(function(m){if(m.id==='none'&&!nm(s.cafe))return;h+=chip('data-m="'+m.id+'"',s.milk===m.id,ico(m.id),BG[m.id],m.n,m.p)});$('milks').innerHTML=h;
 h='';TOP.forEach(function(t){h+=chip('data-t="'+t.id+'"',s.tops.indexOf(t.id)>=0,ico(t.id),BG[t.id],t.n,t.p)});$('tops').innerHTML=h;
 $('tmpw').style.display=ht(s.cafe)?'':'none';$('temps').innerHTML=chip('data-p="hot"',s.temp==='hot',ico('hot'),BG.hot,'Caliente',0)+chip('data-p="cold"',s.temp==='cold',ico('cold'),BG.cold,'Frío',0);
 $('qv').textContent=s.qty;var u=unit(s);$('up').textContent=NF(u)+' c/u';$('tot').textContent=NF(u*s.qty);
}
function persist(){try{localStorage.setItem('cafe-favoritos',JSON.stringify(FAV))}catch(e){}}
function rf(){var h='';FAV.forEach(function(o,i){h+='<div class="fav"><div class="im">'+cup(o.cafe)+'</div><div class="tx"><b>'+by(CAF,o.cafe).n+' × '+o.qty+'</b><br>'+desc(o)+'<br>'+NF(unit(o)*o.qty)+'</div><button class="btn alt sm" data-fu="'+i+'">Usar</button><button class="x" data-fd="'+i+'" aria-label="Eliminar">✕</button></div>'});
 $('favs').innerHTML=h||'<p class="soft">Aún no tienes favoritos. Guarda aquí tu pedido predeterminado.</p>';$('fc').textContent=FAV.length+'/5';$('fsave').style.display=DEF?'':'none'}
function addFav(o,mid){var k=key(o),m;
 if(FAV.some(function(x){return key(x)===k}))m='Ya está en tus favoritos';
 else if(FAV.length>=5)m='Tu almacén está lleno (5/5). Elimina uno para guardar otro.';
 else{FAV.push({cafe:o.cafe,milk:o.milk,tops:o.tops.slice(),qty:o.qty,temp:o.temp||'hot'});persist();m='¡Agregado a favoritos!'}
 $(mid).textContent=m;rf()}
document.body.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var d=b.dataset;
 if(d.c){s.cafe=d.c;if(s.milk==='none'&&!nm(d.c))s.milk='desl'}
 else if(d.m)s.milk=d.m;
 else if(d.p)s.temp=d.p;
 else if(d.go){if(d.nw)s={cafe:'latte',milk:'desl',tops:[],qty:1,temp:'hot'};go(d.go)}
 else if(d.du){if(DEF){s={cafe:DEF.cafe,milk:DEF.milk,tops:DEF.tops.slice(),qty:DEF.qty,temp:DEF.temp||'hot'};window.scrollTo(0,0)}}
 else if(d.ds){if(DEF)addFav(DEF,'dmsg')}
 else if(d.t){var i=s.tops.indexOf(d.t);if(i<0)s.tops.push(d.t);else s.tops.splice(i,1)}
 else if(d.q)s.qty=Math.max(1,Math.min(99,s.qty+ +d.q));
 else if(d.fu!==undefined){var f=FAV[+d.fu];s={cafe:f.cafe,milk:f.milk,tops:f.tops.slice(),qty:f.qty,temp:f.temp||'hot'};go('order')}
 else if(d.fd!==undefined){FAV.splice(+d.fd,1);persist();rf();$('fmsg').textContent=''}
 else if(b.id==='fsave'){if(DEF)addFav(DEF,'fmsg')}
 render()});
function th(svg,bg,a,b){return '<div class="th"><div class="im" style="background:'+bg+'">'+svg+'</div><b>'+a+'</b><br>'+b+'</div>'}
function show(o,isNew,ok){
 var cf=by(CAF,o.cafe),ml=by(MIL,o.milk),u=unit(o),t=NF(u*o.qty),f=new Date(o.t).toLocaleString('es'),
 tb=th(cup(cf.id),'#ebe0c8',cf.n,NF(cf.p)),rows='<div class="ln"><span>'+cf.n+'</span><span>'+NF(cf.p)+'</span></div>',
 txt='COMANDA '+o.num+'\n'+f+'\nCliente: '+o.nom+'\n--------------\n'+cf.n+' '+NF(cf.p)+'\n';
 if(tp(o)){var hc=tp(o)==='cold',tn=hc?'Frío':'Caliente';tb+=th(ico(tp(o)),BG[tp(o)],tn,'');rows+='<div class="ln"><span>'+tn+'</span><span></span></div>';txt+=tn+'\n'}
 if(o.milk!=='none'){tb+=th(ico(ml.id),BG[ml.id],ml.l,'+'+NF(ml.p));rows+='<div class="ln"><span>'+ml.l+'</span><span>+'+NF(ml.p)+'</span></div>';txt+=ml.l+' +'+NF(ml.p)+'\n'}
 o.tops.forEach(function(id){var p=by(TOP,id);tb+=th(ico(id),BG[id],p.n,'+'+NF(p.p));rows+='<div class="ln"><span>Topping '+p.n.toLowerCase()+'</span><span>+'+NF(p.p)+'</span></div>';txt+='Topping '+p.n+' +'+NF(p.p)+'\n'});
 txt+='Precio por café: '+NF(u)+'\nCantidad: '+o.qty+'\n--------------\nTOTAL A PAGAR: '+t;
 $('tk').innerHTML='<div class="panel"><h2>'+(isNew?'¡Pedido listo!':'Tu café predeterminado')+'</h2><div class="thumbs">'+tb+'</div><div class="big">'+t+'</div><div class="cap">TOTAL A PAGAR</div>'+
 '<div class="tk"><b>COMANDA '+o.num+'</b><br>'+f+'<br>Cliente: '+esc(o.nom)+'<hr>'+rows+'<hr><div class="ln"><span>Precio por café</span><span>'+NF(u)+'</span></div><div class="ln"><span>Cantidad</span><span>× '+o.qty+'</span></div><div class="ln"><b>Total</b><b>'+t+'</b></div></div>'+
 '<div class="msg" id="msg">'+(isNew?(ok?'Guardado como tu café predeterminado':'No se pudo guardar en este dispositivo'):'')+'</div>'+
 '<div class="acts"><a class="btn" id="wa" target="_blank" rel="noopener">Enviar por WhatsApp</a><a class="btn alt" id="sm">Enviar por SMS</a><button class="btn alt" id="cp">Copiar comanda</button><button class="btn alt" id="fv">♡ Agregar a favoritos</button><button class="btn alt" id="vl">Editar este pedido</button><button class="btn alt" id="nv">Nuevo pedido</button></div></div>';
 $('wa').href='https://wa.me/'+NUM+'?text='+encodeURIComponent(txt);
 $('sm').href='sms:+'+NUM+'?&body='+encodeURIComponent(txt);
 $('cp').onclick=function(){var m=$('msg');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){m.textContent='¡Copiada!'},function(){m.textContent='No se pudo copiar'})}else{m.textContent='No se pudo copiar'}};
 $('fv').onclick=function(){addFav(o,'msg')};
 $('vl').onclick=function(){s={cafe:o.cafe,milk:o.milk,tops:o.tops.slice(),qty:o.qty,temp:o.temp||'hot'};$('cli').value=o.nom==='Sin nombre'?'':o.nom;render();cl()};
 $('nv').onclick=function(){s={cafe:'latte',milk:'desl',tops:[],qty:1,temp:'hot'};render();cl()};
 var ov=$('ov');ov.style.display='block';ov.scrollTop=0}
function cl(){$('ov').style.display='none'}
function go(v){['home','order','favp'].forEach(function(i){$(i).style.display=i===v?'':'none'});window.scrollTo(0,0);if(v==='order')rd()}
function rd(){var o=DEF;if(!o){$('defw').innerHTML='<p class="soft">Aún no tienes un café predeterminado. Se guarda el último pedido que envíes.</p>';return}
 $('defw').innerHTML='<div class="fav"><div class="im">'+cup(o.cafe)+'</div><div class="tx"><b>'+by(CAF,o.cafe).n+' × '+o.qty+'</b><br>'+desc(o)+'<br>'+NF(unit(o)*o.qty)+'</div><button class="btn sm" data-du="1">Usar</button></div><button class="btn alt sm" data-ds="1">♡ Guardar en favoritos</button>'}
$('send').onclick=function(){var now=Date.now(),ok=false,o={cafe:s.cafe,milk:s.milk,tops:s.tops.slice(),qty:s.qty,temp:s.temp,nom:$('cli').value.trim()||'Sin nombre',t:now,num:'#'+String(now).slice(-5)};
 DEF=o;try{localStorage.setItem('cafe-predeterminado',JSON.stringify(o));ok=true}catch(e){}
 chime();show(o,true,ok);rf();rd()};
function ctx(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function pop(){try{var a=ctx(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(820,t);o.frequency.exponentialRampToValueAtTime(260,t+.07);g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.12)}catch(e){}}
function chime(){try{var a=ctx(),t=a.currentTime;[1047,1319,1568,2093].forEach(function(f,i){var o=a.createOscillator(),g=a.createGain(),b=t+i*.11;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,b);g.gain.exponentialRampToValueAtTime(.2,b+.02);g.gain.exponentialRampToValueAtTime(.001,b+.7);o.connect(g);g.connect(a.destination);o.start(b);o.stop(b+.75)})}catch(e){}}
document.addEventListener('click',function(e){var b=e.target.closest('button,a.btn');if(b&&b.id!=='send')pop()});
if(!(DEF&&DEF.cafe&&by(CAF,DEF.cafe)))DEF=null;
render();rf();
</script>
