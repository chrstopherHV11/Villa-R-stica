<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffdf9">
  <title>Pedidos · Villa Rústica</title>
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&family=Oswald:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body data-area="cafe">
  <header class="top">
    <a class="brand" href="index.html" aria-label="Inicio de la comandera"><img src="logo.png" alt="" width="36" height="34"><span><b>Villa Rústica</b><small>Pedidos</small></span></a>
    <span class="spacer"></span>
    <span class="reloj" id="reloj"></span>
    <div class="area-tab" id="area-tab" role="group" aria-label="Cambiar área"></div>
  </header>

  <main class="pedidos">
    <div class="ped-head">
      <h1 id="titulo">Cafetería</h1>
      <div class="seg" id="vista" role="group"></div>
    </div>
    <div id="contenido"></div>
  </main>

  <div class="demo-bar no-print">
    <span>Demo</span>
    <button type="button" data-demo="cafe">☕ Pedido web</button>
    <button type="button" data-demo="cafe-tarde">☕ Para más tarde</button>
    <button type="button" data-demo="pan">🥖 Pedido de pan</button>
  </div>

  <div class="sonido" id="sonido">
    <div>
      <h2>Pedidos</h2>
      <p>Toca para empezar. Así la tablet podrá sonar cuando llegue un pedido.</p>
      <button type="button" class="btn lg" id="activar">Activar avisos con sonido</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="datos.js"></script>
  <script src="nube.js"></script>
  <script src="tablero.js"></script>
  <script src="pedidos.js"></script>
</body>
</html>
